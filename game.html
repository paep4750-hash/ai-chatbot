<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS 3D SURVIVAL - THE CAMPFIRE</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020804;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    /* 📊 หน้าจอสถานะ UI */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(5, 15, 7, 0.9);
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 10;
      min-width: 200px;
    }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
    #wave-text { color: #ffbc00; font-size: 1.2rem; }
    
    /* หลอดเลือด HP */
    .bar-bg { width: 100%; height: 16px; background: #441111; border-radius: 8px; overflow: hidden; border: 1px solid #ff5555; }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff3333, #ff7777); transition: width 0.2s; }
    
    /* ข้อความแจ้งเตือนกลางหน้าจอ */
    #msg-overlay {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff3333;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 0 0 8px #000;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      display: none;
    }

    /* 🎯 เป้าเล็ง */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #ff3b3b;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 6px #ff0000;
    }

    /* 🕹️ Joystick */
    #joystick-zone {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      touch-action: none;
      z-index: 10;
    }
    #joystick-stick {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #ff3b3b, #ff7a00);
      border-radius: 50%;
      position: absolute;
      left: 35px;
      top: 35px;
      touch-action: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <div class="status-row">
      <span id="wave-text">WAVE 1 / 10</span>
      <span id="wood-text">ไม้ในตัว: 0</span>
    </div>
    <div style="margin-bottom: 5px; font-size: 0.85rem; color:#aaa;">HP ของคุณ:</div>
    <div class="bar-bg"><div id="hp-bar"></div></div>
    <div style="font-size: 0.75rem; margin-top: 8px; color: #6be375;">*จิ้มหน้าจอฝั่งขวาเพื่อเหวี่ยงขวานโจมตี!*</div>
  </div>

  <div id="msg-overlay"></div>
  <div id="crosshair"></div>
  <div id="canvas-container"></div>

  <div id="joystick-zone"><div id="joystick-stick"></div></div>

  <script>
    // --- 1. GAME STATE變數 ---
    let hp = 100;
    let currentWave = 1;
    let woodCollected = 0;
    let isGameOver = false;

    // --- 2. SETUP THREE.JS SCENE ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020804); 
    scene.fog = new THREE.FogExp2(0x020804, 0.035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- 3. ระบบแสง ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.15); 
    scene.add(ambientLight);

    // ไฟฉาย Super Bright
    const flashlight = new THREE.SpotLight(0xfffbe6, 5.0, 70, Math.PI / 4.5, 0.6, 0.5);
    flashlight.castShadow = true;
    scene.add(flashlight);
    scene.add(flashlight.target);

    // พื้นดินป่าดงดิบ
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x112213, roughness: 1.0 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const playerPosition = new THREE.Vector3(0, 2, 15); // เริ่มต้นห่างจากแคมป์ไฟเล็กน้อย
    camera.position.copy(playerPosition);

    // --- 4. สร้างกองไฟป่า (CAMPFIRE) ไว้ที่จุดศูนย์กลาง (0,0) ---
    const campfireGroup = new THREE.Group();
    campfireGroup.position.set(0, 0, 0);

    // ขอนไม้ฐานกองไฟ
    const logMat = new THREE.MeshStandardMaterial({ color: 0x3d2314 });
    for(let i=0; i<4; i++) {
      const campLog = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.5), logMat);
      campLog.rotation.z = Math.PI/2;
      campLog.rotation.y = (Math.PI/4) * i;
      campLog.position.y = 0.1;
      campfireGroup.add(campLog);
    }
    scene.add(campfireGroup);

    // แสงไฟและความร้อนจากแคมป์ไฟ 🔥
    const campfireLight = new THREE.PointLight(0xff7700, 4, 30);
    campfireLight.position.set(0, 1, 0);
    scene.add(campfireLight);

    // ตัวแทนเอฟเฟกต์ลูกไฟ
    const fireMesh = new THREE.Mesh(
      new THREE.ConeGeometry(0.6, 1.2, 8),
      new THREE.MeshBasicMaterial({ color: 0xff5500, wireframe: true })
    );
    fireMesh.position.set(0, 0.6, 0);
    scene.add(fireMesh);

    // --- 5. เสกต้นไม้ 600 ต้น และเศษไม้รอบๆ ---
    const woodLogs = [];
    function createTreeAndWood(x, z) {
      // เว้นจุดแคมป์ไฟตรงกลางไว้
      if (Math.abs(x) < 18 && Math.abs(z) < 18) return;

      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, 5, 8), new THREE.MeshStandardMaterial({ color: 0x3e2713 }));
      trunk.position.y = 2.5;
      tree.add(trunk);

      const leaveMat = new THREE.MeshStandardMaterial({ color: 0x05210b, roughness: 0.8 });
      for(let i=0; i<4; i++) {
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.6 - (i*0.5), 3.5, 8), leaveMat);
        leaves.position.y = 4.0 + (i * 1.5);
        tree.add(leaves);
      }
      tree.position.set(x, 0, z);
      scene.add(tree);

      // โอกาส 25% ที่จะมีเศษไม้ดรอปอยู่ใต้ต้นไม้ให้ผู้เล่นเก็บมาเติมไฟ 🪵
      if(Math.random() < 0.25) {
        const wood = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
        wood.rotation.z = Math.PI / 2;
        wood.rotation.y = Math.random() * Math.PI;
        wood.position.set(x + (Math.random() - 0.5)*3, 0.08, z + (Math.random() - 0.5)*3);
        scene.add(wood);
        woodLogs.push(wood);
      }
    }

    for (let i = 0; i < 600; i++) {
      let x = (Math.random() - 0.5) * 400;
      let z = (Math.random() - 0.5) * 400;
      createTreeAndWood(x, z);
    }

    // --- 6. เสกโมเดลขวาน (AXE) ติดหน้าจอ ---
    const axeGroup = new THREE.Group();
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.8), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
    handle.rotation.x = Math.PI / 2;
    axeGroup.add(handle);

    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.18, 0.22), new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8 }));
    blade.position.set(0, 0.06, -0.3);
    axeGroup.add(blade);
    scene.add(axeGroup);

    // --- 7. ระบบศัตรูบล็อกกลมสีแดง (ENEMIES) ---
    const enemies = [];
    
    function spawnWave(waveNum) {
      if(waveNum > 10) {
        showOverlay("🎉 คุณชนะเกม! รอดพ้นทัง 10 เวฟ!", "#6be375");
        isGameOver = true;
        return;
      }
      
      document.getElementById('wave-text').innerText = `WAVE ${waveNum} / 10`;
      showOverlay(`⚠️ WAVE ${waveNum} เริ่มต้น!`, "#ff3b3b");

      // เวฟยิ่งสูง มอนยิ่งเกิดเยอะขึ้น
      const count = 5 + (waveNum * 3); 
      for(let i=0; i<count; i++) {
        const enemyGeo = new THREE.SphereGeometry(1.2, 16, 16);
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x660000 });
        const enemy = new THREE.Mesh(enemyGeo, enemyMat);
        
        // เกิดรอบๆ แมพห่างขอบแคมป์ไฟออกไป
        let angle = Math.random() * Math.PI * 2;
        let radius = 60 + Math.random() * 80;
        enemy.position.set(Math.cos(angle) * radius, 1.2, Math.sin(angle) * radius);
        
        // เก็บสถานะคูลดาวน์ดาเมจไว้ในตัวมอนสเตอร์เลย
        enemy.userData = { lastAttackTime: 0 };
        
        scene.add(enemy);
        enemies.push(enemy);
      }
    }

    // เปิดเวฟแรกทันทีตอนเริ่มเกม
    setTimeout(() => { spawnWave(currentWave); }, 1500);

    // --- 8. ระบบปุ่มควบคุม MULTI-TOUCH และระบุการฟันโจมตี ---
    let moveX = 0, moveZ = 0;
    let yaw = 0, pitch = 0;
    let joystickTouchId = null;
    let lookTouchId = null;
    let lastTouchX = 0, lastTouchY = 0;
    let isAttacking = false;
    let attackTimer = 0;

    const stick = document.getElementById('joystick-stick');
    const zone = document.getElementById('joystick-zone');
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const maxRadius = 35;

    window.addEventListener('touchstart', (e) => {
      if(isGameOver) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        
        if (touch.clientX < window.innerWidth / 2 && touch.clientY > window.innerHeight / 2 && joystickTouchId === null) {
          joystickTouchId = touch.identifier;
          updateJoystick(touch);
        } else if (lookTouchId === null) {
          lookTouchId = touch.identifier;
          lastTouchX = touch.clientX;
          lastTouchY = touch.clientY;
          
          // 🔥 ทริกเกอร์: ถ้าจิ้มหน้าจอฝั่งขวา แปลว่าสั่งเหวี่ยงขวานโจมตีด้วย!
          if(!isAttacking && touch.clientX > window.innerWidth / 3) {
            isAttacking = true;
            attackTimer = 0;
            executeAxeAttack();
          }
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        if (touch.identifier === joystickTouchId) updateJoystick(touch);
        if (touch.identifier === lookTouchId) {
          const deltaX = touch.clientX - lastTouchX;
          const deltaY = touch.clientY - lastTouchY;
          yaw -= deltaX * 0.005;
          pitch -= deltaY * 0.005;
          pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
          lastTouchX = touch.clientX;
          lastTouchY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
          joystickTouchId = null;
          stick.style.transform = 'translate(0px, 0px)';
          moveX = 0; moveZ = 0;
        }
        if (touch.identifier === lookTouchId) lookTouchId = null;
      }
    });

    function updateJoystick(touch) {
      let deltaX = touch.clientX - centerX;
      let deltaY = touch.clientY - centerY;
      const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      if (distance > maxRadius) {
        deltaX = (deltaX / distance) * maxRadius;
        deltaY = (deltaY / distance) * maxRadius;
      }
      stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      moveX = deltaX / maxRadius;
      moveZ = -deltaY / maxRadius;
    }

    // 🔥 ระบบคำนวณการใช้ขวานสับมอนสเตอร์ (ดาเมจ 100 ทีเดียวตาย)
    function executeAxeAttack() {
      // สร้าง Raycast ยิงลำแสงจากเป้าเล็งกลางจอไปข้างหน้า
      const raycaster = new THREE.Raycaster();
      // ศูนย์กลางจอคือพิกัดเวกเตอร์ (0,0) ใน Three.js
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      
      // ระยะฟันของขวานหวังผล (6 เมตร)
      const intersects = raycaster.intersectObjects(enemies);
      
      if(intersects.length > 0 && intersects[0].distance < 6) {
        const hitEnemy = intersects[0].object;
        const index = enemies.indexOf(hitEnemy);
        if(index > -1) {
          // ลบออกจากฉากทันที (ตายในทีเดียว)
          scene.remove(hitEnemy);
          enemies.splice(index, 1);
          
          // เช็คเงื่อนไขหมดเวฟ
          if(enemies.length === 0 && !isGameOver) {
            currentWave++;
            setTimeout(() => { spawnWave(currentWave); }, 2000);
          }
        }
      }
    }

    // ฟังก์ชันโชว์ตัวอักษรประกาศเวฟกลางหน้าจอ
    function showOverlay(text, color) {
      const overlay = document.getElementById('msg-overlay');
      overlay.innerText = text;
      overlay.style.color = color;
      overlay.style.display = 'block';
      setTimeout(() => { overlay.style.display = 'none'; }, 2500);
    }

    // --- 9. MAIN GAME LOOP ---
    const clock = new THREE.Clock();
    const playerSpeed = 8.0;
    const enemySpeed = 4.8;
    const campfireRadius = 14; // รัศมีอาณาเขตปลอดภัยที่มอนไม่กล้าเข้าใกล้

    function animate() {
      requestAnimationFrame(animate);
      if(isGameOver) return;

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // ขยับผู้เล่นตามจอย
      if (moveX !== 0 || moveZ !== 0) {
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const moveDirection = forward.clone().multiplyScalar(moveZ).add(right.clone().multiplyScalar(moveX)).normalize();
        playerPosition.addScaledVector(moveDirection, playerSpeed * delta);
      }
      camera.position.copy(playerPosition);

      // คำนวณทิศสายตา
      const target = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const lookDirection = target.clone().normalize();
      camera.lookAt(camera.position.clone().add(lookDirection));

      // ผูกไฟฉายเข้ากับพิกัดสายตา
      flashlight.position.copy(camera.position);
      flashlight.target.position.copy(camera.position.clone().add(lookDirection.clone().multiplyScalar(10)));

      // กองไฟสั่นไหวสมจริง
      fireMesh.scale.set(1 + Math.sin(time*10)*0.1, 1 + Math.cos(time*12)*0.1, 1);

      // 🪵 ระบบตรวจสอบการเดินไป "เก็บเศษไม้"
      for(let i = woodLogs.length - 1; i >= 0; i--) {
        if(playerPosition.distanceTo(woodLogs[i].position) < 2.5) {
          scene.remove(woodLogs[i]);
          woodLogs.splice(i, 1);
          woodCollected++;
          document.getElementById('wood-text').innerText = `ไม้ในตัว: ${woodCollected}`;
        }
      }

      // 🪵 ระบบตรวจสอบการเดินเอาไม้ไป "เติมกองไฟกลางแมพ"
      if(woodCollected > 0 && playerPosition.distanceTo(new THREE.Vector3(0, 2, 0)) < 4) {
        woodCollected = 0;
        document.getElementById('wood-text').innerText = `ไม้ในตัว: 0`;
        showOverlay("🔥 เติมเชื้อเพลิงกองไฟเรียบร้อย ปลอดภัย!", "#6be375");
      }

      // 🪓 ลอจิกอนิเมชันตอนฟันขวาน
      const axePos = camera.position.clone()
        .add(lookDirection.clone().multiplyScalar(0.5))
        .add(new THREE.Vector3(0, 1, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(-0.25))
        .add(new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(0.2));
      
      axeGroup.position.copy(axePos);
      
      if (isAttacking) {
        attackTimer += delta * 7; // ความเร็วอนิเมชันเหวี่ยง
        // เอฟเฟกต์หมุนสับขวานไปข้างหน้า
        axeGroup.rotation.set(pitch + Math.sin(attackTimer) * 0.6, yaw, -Math.sin(attackTimer) * 0.3);
        if(attackTimer > Math.PI) { isAttacking = false; }
      } else {
        axeGroup.rotation.set(pitch, yaw, 0);
        // เดินแล้วขวานสั่นเบาๆ
        if(moveX !== 0 || moveZ !== 0) {
          axeGroup.position.y += Math.sin(time * 12) * 0.006;
        }
      }

      // 🔴 AI มอนสเตอร์วิ่งไล่ และกลัวแคมป์ไฟ
      const currentTimeMs = Date.now();
      enemies.forEach(enemy => {
        const distToPlayer = enemy.position.distanceTo(playerPosition);
        const distToCampfire = enemy.position.distanceTo(new THREE.Vector3(0, 1.2, 0));

        // เงื่อนไข: ถ้ายูนิทยังอยู่ห่างแคมป์ไฟ จะเดินไล่ตามปกติ
        if (distToCampfire > campfireRadius) {
          if (distToPlayer < 80) {
            const dir = new THREE.Vector3().subVectors(playerPosition, enemy.position);
            dir.y = 0; dir.normalize();
            enemy.position.addScaledVector(dir, enemySpeed * delta);
            enemy.position.y = 1.3 + Math.abs(Math.sin(time * 6 + enemy.id)) * 0.7;
          }
        } else {
          // 🔥 ถ้ามันหลุดเข้าใกล้รัศมีแคมป์ไฟ มันจะโดนแรงสะท้อนผลักให้วิ่งถอยหลังหนีออกไปทันที!
          const pushDir = new THREE.Vector3().subVectors(enemy.position, new THREE.Vector3(0, 1.2, 0));
          pushDir.y = 0; pushDir.normalize();
          enemy.position.addScaledVector(pushDir, enemySpeed * 1.5 * delta);
        }

        // ⚔️ ระบบมอนสเตอร์สร้างดาเมจ (Damage 50, ทุกๆ 2 วินาที)
        if (distToPlayer < 2.5) {
          // ตรวจสอบคูลดาวน์ 2 วินาที (2000 มิลลิวินาที)
          if (currentTimeMs - enemy.userData.lastAttackTime > 2000) {
            hp -= 50;
            enemy.userData.lastAttackTime = currentTimeMs; // รีเซ็ตเวลาโจมตีล่าสุด
            
            // อัปเดตแถบเลือดบนจอ
            document.getElementById('hp-bar').style.width = `${hp}%`;
            
            if (hp <= 0 && !isGameOver) {
              showOverlay("💀 GAME OVER! คุณถูกบล็อกแดงขย้ำ!", "#ff3333");
              isGameOver = true;
            } else {
              showOverlay("💥 โดนโจมตี! HP ลดลง 50!", "#ff7700");
            }
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
