<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D First-Person for Tablet (Touch Controls)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; user-select: none; touch-action: none; background: #000; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; }
        
        /* ปุ่มจอยสติ๊กฝั่งซ้าย */
        #joystick-container {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px; background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4); border-radius: 50%;
            z-index: 10; display: flex; justify-content: center; align-items: center;
        }
        #joystick-knob {
            width: 50px; height: 50px; background: rgba(255,255,255,0.8);
            border-radius: 50%; position: absolute; transition: transform 0.05s ease;
        }
        
        /* ข้อความแนะนำสั้นๆ */
        #ui-hint {
            position: absolute; top: 20px; left: 20px; color: white;
            z-index: 10; pointer-events: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        #ui-hint h1 { margin: 0 0 5px 0; font-size: 1.5rem; }
        #ui-hint p { margin: 0; font-size: 0.9rem; opacity: 0.8; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-hint">
        <h1>3D World (Tablet Version)</h1>
        <p>🕹️ ซ้าย: ลากจอยสติ๊กเพื่อเดิน | 📱 ขวา: ปัดหน้าจอเพื่อหันมอง</p>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let moveX = 0, moveZ = 0; // ค่าการเคลื่อนที่จากจอยสติ๊ก
        
        // ตัวแปรสำหรับมุมมองกล้อง (หันมอง)
        let yaw = 0, pitch = 0;
        const lookSpeed = 0.005;
        
        // ข้อมูลสัมผัสหน้าจอ
        let touchLookId = null;
        let touchLookStartX, touchLookStartY;

        let cars = [];
        const carSpeed = 0.15;

        init();
        animate();

        function init() {
            // 1. ฉากและท้องฟ้า
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            // 2. กล้อง (ระดับสายตาคนสูง 1.6)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            // 3. แสงสว่าง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 4. สร้างโลก 3D (บ้านและถนน)
            createWorld();

            // 5. เรนเดอร์ลงหน้าจอ
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 6. ตั้งค่าระบบสัมผัส (Touch Events)
            setupTouchControls();

            window.addEventListener('resize', onWindowResize);
        }

        function createWorld() {
            // พื้นดิน
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x557a46 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // --- [สร้างบ้าน] ---
            const floorGeo = new THREE.PlaneGeometry(8, 8);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, 0.01, -2);
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc });
            
            const wallBack = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 0.2), wallMat);
            wallBack.position.set(0, 1.5, -6);
            scene.add(wallBack);

            const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 8), wallMat);
            wallLeft.position.set(-4, 1.5, -2);
            scene.add(wallLeft);

            const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 8), wallMat);
            wallRight.position.set(4, 1.5, -2);
            scene.add(wallRight);

            const wallFrontLeft = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.2), wallMat);
            wallFrontLeft.position.set(-2.5, 1.5, 2);
            scene.add(wallFrontLeft);

            const wallFrontRight = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.2), wallMat);
            wallFrontRight.position.set(2.5, 1.5, 2);
            scene.add(wallFrontRight);

            const wallFrontTop = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 0.2), wallMat);
            wallFrontTop.position.set(0, 2.6, 2);
            scene.add(wallFrontTop);

            const roofGeo = new THREE.ConeGeometry(6, 2, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 4, -2);
            roof.rotation.y = Math.PI / 4;
            scene.add(roof);

            // --- [ถนนและรถ] ---
            const roadGeo = new THREE.PlaneGeometry(1000, 12);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0.02, 15);
            scene.add(road);

            for(let i = -200; i < 200; i += 10) {
                const lineGeo = new THREE.PlaneGeometry(4, 0.2);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i, 0.03, 15);
                scene.add(line);
            }

            for (let i = 0; i < 4; i++) {
                spawnCar((i * 60) - 100);
            }
        }

        function spawnCar(xPosition = -150) {
            const carGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(4, 1.2, 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0xcc2222 : 0x2222cc });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            carGroup.add(body);

            const cabinGeo = new THREE.BoxGeometry(2, 0.8, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0.2, 1.6, 0);
            carGroup.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 12);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const positions = [[-1.2, 0.4, 1], [1.2, 0.4, 1], [-1.2, 0.4, -1], [1.2, 0.4, -1]];
            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.x = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                carGroup.add(wheel);
            });

            const isLeftLane = Math.random() > 0.5;
            carGroup.position.set(xPosition, 0, isLeftLane ? 13.5 : 16.5);
            carGroup.userData = { direction: isLeftLane ? 1 : -1 };
            if(!isLeftLane) carGroup.rotation.y = Math.PI;

            scene.add(carGroup);
            cars.push(carGroup);
        }

        // --- [ระบบควบคุมด้วยการสัมผัสหน้าจอ] ---
        function setupTouchControls() {
            const joystick = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const maxRadius = 40; // ระยะดึงจอยสติ๊กสูงสุด
            let joystickTouchId = null;

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    
                    // ตรวจสอบว่าจิ้มฝั่งซ้าย (บริเวณจอยสติ๊ก) หรือไม่
                    if (touch.clientX < window.innerWidth / 2 && joystickTouchId === null) {
                        joystickTouchId = touch.identifier;
                        updateJoystick(touch.clientX, touch.clientY);
                    } 
                    // ถ้าจิ้มฝั่งขวา คือ การหันมองรอบๆ
                    else if (touch.clientX >= window.innerWidth / 2 && touchLookId === null) {
                        touchLookId = touch.identifier;
                        touchLookStartX = touch.clientX;
                        touchLookStartY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    
                    // อัปเดตการเดินจากจอยสติ๊ก
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch.clientX, touch.clientY);
                    }
                    // อัปเดตการหันมองจากนิ้วฝั่งขวา
                    if (touch.identifier === touchLookId) {
                        const deltaX = touch.clientX - touchLookStartX;
                        const deltaY = touch.clientY - touchLookStartY;
                        
                        yaw -= deltaX * lookSpeed;
                        pitch -= deltaY * lookSpeed;
                        pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch)); // ล็อกไม่ให้เงยหน้าเกินไป
                        
                        touchLookStartX = touch.clientX;
                        touchLookStartY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        knob.style.transform = 'translate(0px, 0px)';
                        moveX = 0; moveZ = 0; // หยุดเดิน
                    }
                    if (touch.identifier === touchLookId) {
                        touchLookId = null;
                    }
                }
            });

            function updateJoystick(clientX, clientY) {
                let dx = clientX - centerX;
                let dy = clientY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > maxRadius) {
                    dx = (dx / distance) * maxRadius;
                    dy = (dy / distance) * maxRadius;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                
                // แปลงค่าส่งไปควบคุมการเคลื่อนที่ (อัตราส่วน -1 ถึง 1)
                moveX = dx / maxRadius;
                moveZ = dy / maxRadius;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 1. อัปเดตมุมมองกล้อง (การหันมอง)
            const target = new THREE.Vector3();
            target.x = Math.sin(yaw) * Math.cos(pitch);
            target.y = Math.sin(pitch);
            target.z = Math.cos(yaw) * Math.cos(pitch);
            camera.lookAt(camera.position.clone().add(target));

            // 2. คำนวณทิศทางการเดินตามทิศที่กล้องหันไป
            const speed = 0.08;
            const forward = new THREE.Vector3(target.x, 0, target.z).normalize();
            const right = new THREE.Vector3().crossVectors(camera.up, forward).normalize();

            // เดินหน้า/ถอยหลัง (moveZ) และ ซ้าย/ขวา (moveX)
            camera.position.addScaledVector(forward, -moveZ * speed);
            camera.position.addScaledVector(right, moveX * speed);

            // 3. รักษาระดับสายตาให้สูงเท่าเดิมเสมอตลอดการเดิน
            camera.position.y = 1.6;

            // 4. อัปเดตรถสัญจรบนถนน
            cars.forEach((car) => {
                car.position.x += carSpeed * car.userData.direction;
                if (car.position.x > 150 && car.userData.direction === 1) car.position.x = -150;
                else if (car.position.x < -150 && car.userData.direction === -1) car.position.x = 150;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
