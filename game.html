<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS 3D SURVIVAL - FLASHLIGHT UPDATE</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050d07;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-info {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(5, 13, 7, 0.9);
      color: #ff3b3b;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 59, 59, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    h1 { margin: 0 0 4px 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
    p { margin: 0; font-size: 0.85rem; color: #e2e8f0; }

    /* 🎯 เป้าเล็งกลางหน้าจอ */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #ff3b3b;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 4px #ff0000;
    }

    /* 🕹️ ปุ่ม Joystick ซ้ายล่าง */
    #joystick-zone {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      touch-action: none;
      z-index: 10;
    }
    #joystick-stick {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #ff3b3b, #ff7a00);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(255, 59, 59, 0.4);
      position: absolute;
      left: 35px;
      top: 35px;
      touch-action: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-info">
    <h1>🔦 NEXUS SURVIVAL - LIGHT V3</h1>
    <p>อัปเกรดไฟฉาย Super Bright! ส่องตามมุมก้มเงยสายตาแล้วครับเพื่อน!</p>
  </div>

  <div id="crosshair"></div>
  <div id="canvas-container"></div>

  <div id="joystick-zone">
    <div id="joystick-stick"></div>
  </div>

  <script>
    // --- 1. SETUP โลก 3D ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050c06); 
    scene.fog = new THREE.FogExp2(0x050c06, 0.032); // ปรับหมอกให้ลงตัวขึ้น

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- 2. แสงสว่าง (ปรับให้สว่างขึ้นเล็กน้อย) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.35); // เพิ่มแสงรอบข้างให้เห็นดีเทลหญ้าชัดขึ้น
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0x7fff96, 0.3);
    sunLight.position.set(20, 50, 20);
    scene.add(sunLight);

    // 🔥 บัฟพลังไฟฉายติดตัว (Super Flashlight) - แรงขึ้น กว้างขึ้น ไกลขึ้น
    const flashlight = new THREE.SpotLight(0xfffbe6, 5.0, 75, Math.PI / 4.5, 0.6, 0.5);
    flashlight.castShadow = true;
    scene.add(flashlight);
    // เพิ่มเป้าหมายของไฟฉายเข้าไปในฉากเพื่อให้มันหันตามได้อิสระ
    scene.add(flashlight.target);

    // --- 3. สร้างพื้นหญ้าสีป่าดิบ ---
    const groundGeo = new THREE.PlaneGeometry(400, 400);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x162c19, roughness: 1.0 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- 4. ตำแหน่งระดับสายตาผู้เล่น ---
    const playerPosition = new THREE.Vector3(0, 2, 0);
    camera.position.copy(playerPosition);

    // --- 5. เสกโมเดลขวาน (AXE) ---
    const axeGroup = new THREE.Group();
    
    const handleGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.9, 8);
    const handleMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });
    const handle = new THREE.Mesh(handleGeo, handleMat);
    handle.rotation.x = Math.PI / 2; 
    axeGroup.add(handle);

    const bladeGeo = new THREE.BoxGeometry(0.06, 0.22, 0.25);
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });
    const blade = new THREE.Mesh(bladeGeo, bladeMat);
    blade.position.set(0, 0.08, -0.35); 
    axeGroup.add(blade);

    scene.add(axeGroup);

    // --- 6. ระเบิดต้นไม้สะใจ 600 ต้นให้ป่าทึบสุดๆ ---
    function createTree(x, z) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.55, 5, 8),
        new THREE.MeshStandardMaterial({ color: 0x3e2713, roughness: 0.9 })
      );
      trunk.position.y = 2.5;
      tree.add(trunk);

      const leaveMat = new THREE.MeshStandardMaterial({ color: 0x0a2910, roughness: 0.8 });
      for(let i=0; i<4; i++) {
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.6 - (i*0.5), 3.5, 8), leaveMat);
        leaves.position.y = 4.0 + (i * 1.5);
        tree.add(leaves);
      }

      tree.position.set(x, 0, z);
      const scale = 0.6 + Math.random() * 0.8;
      tree.scale.set(scale, scale, scale);
      scene.add(tree);
    }

    for (let i = 0; i < 600; i++) {
      let x = (Math.random() - 0.5) * 360;
      let z = (Math.random() - 0.5) * 360;
      if (Math.abs(x) < 12 && Math.abs(z) < 12) continue; 
      createTree(x, z);
    }

    // --- 7. เสกศัตรูบล็อกกลมๆ แดงๆ ---
    const enemies = [];
    const enemyCount = 25; 

    function spawnEnemy() {
      const enemyGeo = new THREE.SphereGeometry(1.3, 16, 16);
      const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000 });
      const enemy = new THREE.Mesh(enemyGeo, enemyMat);
      
      let x = (Math.random() - 0.5) * 300;
      let z = (Math.random() - 0.5) * 300;
      while(Math.abs(x) < 30 && Math.abs(z) < 30) {
        x = (Math.random() - 0.5) * 300;
        z = (Math.random() - 0.5) * 300;
      }
      enemy.position.set(x, 1.3, z);
      scene.add(enemy);
      enemies.push(enemy);
    }

    for(let i=0; i<enemyCount; i++) spawnEnemy();

    // --- 8. ระบบควบคุม MULTI-TOUCH แบบแยกนิ้วอิสระ ---
    let moveX = 0, moveZ = 0;
    let yaw = 0, pitch = 0;
    
    let joystickTouchId = null;
    let lookTouchId = null;
    let lastTouchX = 0, lastTouchY = 0;

    const stick = document.getElementById('joystick-stick');
    const zone = document.getElementById('joystick-zone');
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const maxRadius = 35;

    window.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.clientX < window.innerWidth / 2 && touch.clientY > window.innerHeight / 2 && joystickTouchId === null) {
          joystickTouchId = touch.identifier;
          updateJoystick(touch);
        } else if (lookTouchId === null) {
          lookTouchId = touch.identifier;
          lastTouchX = touch.clientX;
          lastTouchY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        if (touch.identifier === joystickTouchId) {
          updateJoystick(touch);
        }
        if (touch.identifier === lookTouchId) {
          const deltaX = touch.clientX - lastTouchX;
          const deltaY = touch.clientY - lastTouchY;

          yaw -= deltaX * 0.005;
          pitch -= deltaY * 0.005;
          pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch)); // เพิ่มระยะเงยหน้าขึ้นฟ้าก้มมองพื้น

          lastTouchX = touch.clientX;
          lastTouchY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
          joystickTouchId = null;
          stick.style.transform = 'translate(0px, 0px)';
          moveX = 0; moveZ = 0;
        }
        if (touch.identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    });

    function updateJoystick(touch) {
      let deltaX = touch.clientX - centerX;
      let deltaY = touch.clientY - centerY;
      const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

      if (distance > maxRadius) {
        deltaX = (deltaX / distance) * maxRadius;
        deltaY = (deltaY / distance) * maxRadius;
      }
      stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      moveX = deltaX / maxRadius;
      moveZ = -deltaY / maxRadius;
    }

    // --- 9. GAME LOOP ---
    const clock = new THREE.Clock();
    const playerSpeed = 7.5;
    const enemySpeed = 4.8;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // เดินตามสายตา
      if (moveX !== 0 || moveZ !== 0) {
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const moveDirection = forward.clone().multiplyScalar(moveZ).add(right.clone().multiplyScalar(moveX));
        moveDirection.normalize();
        playerPosition.addScaledVector(moveDirection, playerSpeed * delta);
      }

      camera.position.copy(playerPosition);

      // คำนวณเวกเตอร์สายตา (หันซ้ายขวา ก้มเงย)
      const target = new THREE.Vector3(0, 0, -1);
      target.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
      target.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const lookDirection = target.clone().normalize();
      
      // จุดที่ตากำลังมองไป
      const lookTarget = camera.position.clone().add(lookDirection);
      camera.lookAt(lookTarget);

      // 🔥 แก้ไขระบบไฟฉาย: ให้ไฟฉายตั้งต้นที่ตา และส่องไปที่จุดที่มองอยู่เป๊ะๆ (รองรับการก้มเงยสมบูรณ์แบบ)
      flashlight.position.copy(camera.position);
      flashlight.target.position.copy(camera.position.clone().add(lookDirection.clone().multiplyScalar(10)));

      // ล็อกตำแหน่งขวานให้อยู่ขวาหน้าตรงสายตาพอดี
      const axePos = camera.position.clone()
        .add(lookDirection.clone().multiplyScalar(0.5)) 
        .add(new THREE.Vector3(0, 1, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(-0.25)) 
        .add(new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(0.2));  
      
      axeGroup.position.copy(axePos);
      axeGroup.rotation.set(pitch, yaw, 0);

      // ขวานสั่นเวลาเดิน
      if(moveX !== 0 || moveZ !== 0) {
        axeGroup.position.y += Math.sin(clock.getElapsedTime() * 12) * 0.008;
        axeGroup.position.x += Math.cos(clock.getElapsedTime() * 6) * 0.004;
      }

      // ระบบ AI บล็อกแดงวิ่งไล่กวด
      enemies.forEach(enemy => {
        const dist = enemy.position.distanceTo(playerPosition);
        if(dist < 70) { 
          const direction = new THREE.Vector3().subVectors(playerPosition, enemy.position);
          direction.y = 0;
          direction.normalize();
          enemy.position.addScaledVector(direction, enemySpeed * delta);
          enemy.position.y = 1.3 + Math.abs(Math.sin(clock.getElapsedTime() * 6 + enemy.id)) * 0.8;
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
