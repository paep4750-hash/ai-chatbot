<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS SURVIVAL - STARLIGHT V4</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0a1128;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* 📊 UI หน้าจอ */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(10, 17, 40, 0.85);
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      pointer-events: none;
      z-index: 10;
      min-width: 220px;
      box-shadow: 0 0 10px rgba(0,240,255,0.2);
    }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
    #wave-text { color: #00f0ff; font-size: 1.2rem; text-shadow: 0 0 5px #00f0ff; }
    #wood-text { color: #ffb74d; }
    
    /* หลอดเลือด HP */
    .bar-bg { width: 100%; height: 14px; background: #331111; border-radius: 7px; overflow: hidden; border: 1px solid #ff4444; }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff3333, #ff7777); transition: width 0.15s; }
    
    #msg-overlay {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff3333;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      display: none;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #00f0ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 6px #00f0ff;
    }

    #joystick-zone {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      touch-action: none;
      z-index: 10;
    }
    #joystick-stick {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #00f0ff, #0072ff);
      border-radius: 50%;
      position: absolute;
      left: 35px;
      top: 35px;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0, 114, 255, 0.4);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <div class="status-row">
      <span id="wave-text">WAVE 1 / 10</span>
      <span id="wood-text">🪵 ไม้: 0 / 10</span>
    </div>
    <div style="margin-bottom: 5px; font-size: 0.85rem; color:#ccc;">HP ของผู้เล่น:</div>
    <div class="bar-bg"><div id="hp-bar"></div></div>
    <div style="font-size: 0.75rem; margin-top: 8px; color: #a6d5ff;">*จิ้มจอขวาฟันขวาน | สับต้นไม้เพื่อดรอปไม้ได้!*</div>
  </div>

  <div id="msg-overlay"></div>
  <div id="crosshair"></div>
  <div id="canvas-container"></div>

  <div id="joystick-zone"><div id="joystick-stick"></div></div>

  <script>
    // --- 1. GAME SYSTEMS ---
    let hp = 100;
    let currentWave = 1;
    let woodCollected = 0;
    let isGameOver = false;

    // --- 2. SCENE & LIGHTING (ท้องฟ้าดวงดาว แสงนวลตา) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060b1e); // สีน้ำเงินค่ำคืนมิติดาว
    scene.fog = new THREE.FogExp2(0x060b1e, 0.025); // หมอกจางๆ โทนเย็น

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // แสงนวลคืนเดือนหงาย ไม่มืดเกินไป
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45); 
    scene.add(ambientLight5);

    const moonLight = new THREE.DirectionalLight(0x8faaff, 0.4);
    moonLight.position.set(30, 60, 20);
    scene.add(moonLight);

    // ไฟฉายส่องสว่างติดตัวผู้เล่น
    const flashlight = new THREE.SpotLight(0xfffdf0, 4.0, 80, Math.PI / 4.5, 0.5, 0.5);
    scene.add(flashlight);
    scene.add(flashlight.target);

    // พื้นป่าหญ้าสีเขียวเข้มรับแสงจันทร์
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x16281b, roughness: 0.9 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const playerPosition = new THREE.Vector3(0, 2, 15);
    camera.position.copy(playerPosition);

    // --- 3. ระบบเสกดวงดาวบนท้องฟ้า (Stars) ---
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 500;
    const starsPos = new Float32Array(starsCount * 3);
    for(let i=0; i<starsCount*3; i+=3) {
      starsPos[i] = (Math.random() - 0.5) * 400;
      starsPos[i+1] = 40 + Math.random() * 60; // ลอยอยู่บนฟ้า
      starsPos[i+2] = (Math.random() - 0.5) * 400;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);

    // --- 4. แคมป์ไฟปลอดภัยตรงกลาง ---
    const campfireGroup = new THREE.Group();
    campfireGroup.position.set(0, 0, 0);
    const logMat = new THREE.MeshStandardMaterial({ color: 0x422517 });
    for(let i=0; i<4; i++) {
      const campLog = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.4), logMat);
      campLog.rotation.z = Math.PI/2; campLog.rotation.y = (Math.PI/4) * i;
      campfireGroup.add(campLog);
    }
    scene.add(campfireGroup);

    const campfireLight = new THREE.PointLight(0xff6600, 4, 32);
    campfireLight.position.set(0, 1, 0);
    scene.add(campfireLight);

    const fireMesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 8), new THREE.MeshBasicMaterial({ color: 0xff4500, wireframe: true }));
    fireMesh.position.set(0, 0.6, 0);
    scene.add(fireMesh);

    // --- 5. คลังข้อมูลต้นไม้ และเศษไม้ดรอป ---
    const trees = [];
    const woodLogs = [];

    function createTree(x, z) {
      if (Math.abs(x) < 16 && Math.abs(z) < 16) return;

      const treeGroup = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 5, 8), new THREE.MeshStandardMaterial({ color: 0x4a2e1b }));
      trunk.position.y = 2.5;
      treeGroup.add(trunk);

      const leaveMat = new THREE.MeshStandardMaterial({ color: 0x0c2d15, roughness: 0.8 });
      for(let i=0; i<4; i++) {
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5 - (i*0.4), 3.5, 8), leaveMat);
        leaves.position.y = 4.0 + (i * 1.5);
        treeGroup.add(leaves);
      }
      treeGroup.position.set(x, 0, z);
      
      // เก็บค่ากล่องชนสิ่งกีดขวาง (Bounding Box) สับเปลี่ยนสถานะชนได้
      treeGroup.userData = { radius: 1.2, isTree: true };
      
      scene.add(treeGroup);
      trees.push(treeGroup);
    }

    for (let i = 0; i < 500; i++) {
      createTree((Math.random() - 0.5) * 380, (Math.random() - 0.5) * 380);
    }

    // ฟังก์ชันสำหรับเสกดรอปไม้เวลาตัดต้นไม้สำเร็จ 🪵
    function spawnWoodLog(x, z) {
      const wood = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.75, 8), new THREE.MeshStandardMaterial({ color: 0x9c6633 }));
      wood.rotation.z = Math.PI / 2;
      wood.position.set(x, 0.1, z);
      scene.add(wood);
      woodLogs.push(wood);
    }

    // --- 6. ดีไซน์กรอบขวาน (AXE) ติดตาขวาล่าง ---
    const axeGroup = new THREE.Group();
    const handleMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.85), new THREE.MeshStandardMaterial({ color: 0x6e4726 }));
    handleMesh.rotation.x = Math.PI / 2;
    axeGroup.add(handleMesh);

    // หัวขวานเงางาม คมเหล็กชัดเจน
    const bladeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.16, 0.24), new THREE.MeshStandardMaterial({ color: 0xb0c4de, metalness: 0.85, roughness: 0.15 }));
    bladeMesh.position.set(0, 0.07, -0.32);
    axeGroup.add(bladeMesh);
    scene.add(axeGroup);

    // --- 7. กองทัพมอนสเตอร์บล็อกกลมสีแดง (ENEMIES) ---
    const enemies = [];
    const campfireRadius = 14;

    function spawnWave(waveNum) {
      if(waveNum > 10) {
        showOverlay("🎉 ยอดเยี่ยม! คุณรอดพ้นป่าดงดิบครบ 10 เวฟแล้ว!", "#00f0ff");
        isGameOver = true; return;
      }
      document.getElementById('wave-text').innerText = `WAVE ${waveNum} / 10`;
      showOverlay(`🌌 WAVE ${waveNum} - เก็บไม้ให้ครบ!`, "#ffea00");

      const count = 6 + (waveNum * 3);
      for(let i=0; i<count; i++) {
        const enemy = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 }));
        let angle = Math.random() * Math.PI * 2;
        let radius = 60 + Math.random() * 60;
        enemy.position.set(Math.cos(angle) * radius, 1.2, Math.sin(angle) * radius);
        
        enemy.userData = { lastAttackTime: 0, radius: 1.2 };
        scene.add(enemy);
        enemies.push(enemy);
      }
    }
    setTimeout(() => { spawnWave(currentWave); }, 1500);

    // --- 8. ระบบปุ่มควบคุม MULTI-TOUCH และอนิเมชันฟันแบบใหม่ (Epic Slash) ---
    let moveX = 0, moveZ = 0;
    let yaw = 0, pitch = 0;
    let joystickTouchId = null, lookTouchId = null;
    let lastTouchX = 0, lastTouchY = 0;
    
    let isAttacking = false;
    let attackProgress = 0; // คุมเฟรมการเหวี่ยง

    const stick = document.getElementById('joystick-stick');
    const zone = document.getElementById('joystick-zone');
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const maxRadius = 35;

    window.addEventListener('touchstart', (e) => {
      if(isGameOver) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.clientX < window.innerWidth / 2 && touch.clientY > window.innerHeight / 2 && joystickTouchId === null) {
          joystickTouchId = touch.identifier;
          updateJoystick(touch);
        } else if (lookTouchId === null) {
          lookTouchId = touch.identifier;
          lastTouchX = touch.clientX; lastTouchY = touch.clientY;
          
          // 🔥 ทริกเกอร์ฟันขวานแบบใหม่ ท่าเหวี่ยงฟาดกวาดเฉียง!
          if(!isAttacking && touch.clientX > window.innerWidth / 3) {
            isAttacking = true;
            attackProgress = 0;
            performAxeSlash();
          }
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        if (touch.identifier === joystickTouchId) updateJoystick(touch);
        if (touch.identifier === lookTouchId) {
          const deltaX = touch.clientX - lastTouchX;
          const deltaY = touch.clientY - lastTouchY;
          yaw -= deltaX * 0.005; pitch -= deltaY * 0.005;
          pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
          lastTouchX = touch.clientX; lastTouchY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
          joystickTouchId = null; stick.style.transform = 'translate(0px, 0px)';
          moveX = 0; moveZ = 0;
        }
        if (touch.identifier === lookTouchId) lookTouchId = null;
      }
    });

    function updateJoystick(touch) {
      let deltaX = touch.clientX - centerX;
      let deltaY = touch.clientY - centerY;
      const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      if (distance > maxRadius) {
        deltaX = (deltaX / distance) * maxRadius;
        deltaY = (deltaY / distance) * maxRadius;
      }
      stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      moveX = deltaX / maxRadius; moveZ = -deltaY / maxRadius;
    }

    // 🔥 ระบบคำนวณการใช้ขวานสับมอนสเตอร์ และ "ตัดต้นไม้"
    function performAxeSlash() {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      
      // 1. ตรวจจับการโจมตีใส่ มอนสเตอร์สีแดง (ระยะ 6.5 เมตร)
      const hitEnemies = raycaster.intersectObjects(enemies);
      if(hitEnemies.length > 0 && hitEnemies[0].distance < 6.5) {
        const targetMonster = hitEnemies[0].object;
        const idx = enemies.indexOf(targetMonster);
        if(idx > -1) {
          scene.remove(targetMonster);
          enemies.splice(idx, 1);
        }
        return; // ฟันโดนมอนแล้วหยุดตรวจจับอย่างอื่น
      }

      // 2. ตรวจจับการ "สับตัดต้นไม้" 🌲🪓
      // ดึงออบเจกต์ย่อยทั้งหมดในกลุ่ม Group ต้นไม้มาเช็คระยะชนลำต้น
      const allTrunks = [];
      trees.forEach(t => allTrunks.push(t.children[0])); // ดึงกระบอกลำต้นอันแรกออกมาเช็ค
      
      const hitTrees = raycaster.intersectObjects(allTrunks);
      if(hitTrees.length > 0 && hitTrees[0].distance < 6.5) {
        const targetTrunk = hitTrees[0].object;
        const targetGroup = targetTrunk.parent; // หาตัวพ่อกลุ่มต้นไม้
        const idx = trees.indexOf(targetGroup);
        if(idx > -1) {
          // เสกดรอปเศษไม้ลงพื้นตรงจุดที่ต้นไม้ล้ม
          spawnWoodLog(targetGroup.position.x, targetGroup.position.z);
          
          // ลบต้นไม้ออกจากแมพ
          scene.remove(targetGroup);
          trees.splice(idx, 1);
        }
      }
    }

    function showOverlay(text, color) {
      const overlay = document.getElementById('msg-overlay');
      overlay.innerText = text; overlay.style.color = color;
      overlay.style.display = 'block';
      setTimeout(() => { overlay.style.display = 'none'; }, 2200);
    }

    // --- 9. GAME LOOP ---
    const clock = new THREE.Clock();
    const playerSpeed = 8.0;
    const enemySpeed = 4.6;

    function animate() {
      requestAnimationFrame(animate);
      if(isGameOver) return;

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 1. เก็บพิกัดเก่าของผู้เล่นไว้เผื่อถอยกลับ (แก้อาการเดินทะลุต้นไม้)
      const oldPlayerPos = playerPosition.clone();

      if (moveX !== 0 || moveZ !== 0) {
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const moveDirection = forward.clone().multiplyScalar(moveZ).add(right.clone().multiplyScalar(moveX)).normalize();
        playerPosition.addScaledVector(moveDirection, playerSpeed * delta);
      }

      // 🛑 ตรวจจับขอบเขตชนต้นไม้ของผู้เล่น (Player vs Trees Collision)
      for(let i=0; i<trees.length; i++) {
        const treePos = trees[i].position;
        const dist = playerPosition.distanceTo(new THREE.Vector3(treePos.x, playerPosition.y, treePos.z));
        if(dist < trees[i].userData.radius + 0.6) {
          playerPosition.copy(oldPlayerPos); // เดินชนแล้วเด้งกลับตำแหน่งเดิม เดินทะลุไม่ได้
          break;
        }
      }
      camera.position.copy(playerPosition);

      // อัปเดตมุมกล้องหัน
      const target = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const lookDirection = target.clone().normalize();
      camera.lookAt(camera.position.clone().add(lookDirection));

      // ล็อกไฟฉายหันตามเป๊ะๆ
      flashlight.position.copy(camera.position);
      flashlight.target.position.copy(camera.position.clone().add(lookDirection.clone().multiplyScalar(10)));
      fireMesh.scale.set(1 + Math.sin(time*10)*0.1, 1 + Math.cos(time*12)*0.1, 1);

      // 🪵 ลอจิกการเดินชน "เก็บเศษไม้สีน้ำตาลที่ดรอปพื้น"
      for(let i = woodLogs.length - 1; i >= 0; i--) {
        if(playerPosition.distanceTo(woodLogs[i].position) < 2.5) {
          scene.remove(woodLogs[i]);
          woodLogs.splice(i, 1);
          woodCollected++;
          
          document.getElementById('wood-text').innerText = `🪵 ไม้: ${woodCollected} / 10`;

          // 🔥 เงื่อนไขเด็ด: เก็บครบ 10 ชิ้น ขึ้นเวฟถัดไปทันที!
          if(woodCollected >= 10) {
            woodCollected = 0;
            document.getElementById('wood-text').innerText = `🪵 ไม้: 0 / 10`;
            currentWave++;
            // เคลียร์มอนสเตอร์เวฟเก่าทิ้งให้หมดฉากก่อนขึ้นเวฟใหม่
            enemies.forEach(e => scene.remove(e));
            enemies.length = 0;
            spawnWave(currentWave);
          }
        }
      }

      // 🪓 อนิเมชันเหวี่ยงขวานโค้งสะใจแบบใหม่ (Epic Arc Slash)
      const baseAxePos = camera.position.clone()
        .add(lookDirection.clone().multiplyScalar(0.45))
        .add(new THREE.Vector3(0, 1, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(-0.25))
        .add(new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(0.18));
      
      axeGroup.position.copy(baseAxePos);

      if (isAttacking) {
        attackProgress += delta * 14; // ความเร็วเหวี่ยงฟันสะใจแรงๆ
        // หมอกบิดแกน X และ Y ขวานจะสับโค้งจากขวาไปซ้ายกว้างๆ โคตรเท่!
        axeGroup.rotation.set(pitch + Math.sin(attackProgress)*0.4, yaw - Math.sin(attackProgress)*1.2, Math.cos(attackProgress)*0.5);
        if(attackProgress > Math.PI) { isAttacking = false; }
      } else {
        axeGroup.rotation.set(pitch, yaw, 0);
        if(moveX !== 0 || moveZ !== 0) { // สั่นเบาๆ เวลาเดิน
          axeGroup.position.y += Math.sin(time * 12) * 0.005;
        }
      }

      // 🔴 AI บล็อกกลมแดง (แก้ให้ติดขวางสิ่งกีดขวาง + ติดต้นไม้)
      const currentTimeMs = Date.now();
      enemies.forEach(enemy => {
        const distToPlayer = enemy.position.distanceTo(playerPosition);
        const distToCampfire = enemy.position.distanceTo(new THREE.Vector3(0, 1.2, 0));

        if (distToCampfire > campfireRadius) {
          if (distToPlayer < 75) {
            const oldEnemyPos = enemy.position.clone(); // จำพิกัดเก่ามอนสเตอร์ไว้
            
            const dir = new THREE.Vector3().subVectors(playerPosition, enemy.position);
            dir.y = 0; dir.normalize();
            enemy.position.addScaledVector(dir, enemySpeed * delta);
            enemy.position.y = 1.3 + Math.abs(Math.sin(time * 6 + enemy.id)) * 0.6;

            // 🛑 ลอจิกสำคัญ: มอนสเตอร์เดินชนต้นไม้แล้วจะติดขัด (Enemy vs Trees Collision)
            for(let t=0; t<trees.length; t++) {
              const treePos = trees[t].position;
              const distTree = enemy.position.distanceTo(new THREE.Vector3(treePos.x, enemy.position.y, treePos.z));
              if(distTree < trees[t].userData.radius + enemy.userData.radius) {
                enemy.position.copy(oldEnemyPos); // ชนต้นไม้ปุ๊บ บล็อกแดงจะเด้งถอยหลังติดอยู่ตรงนั้น เดินทะลุไม่ได้แล้ว!
                break;
              }
            }
          }
        } else {
          // ผลักออกจากแคมป์ไฟ
