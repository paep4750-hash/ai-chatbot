<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D First-Person Home & Street</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; }
        #instructions {
            position: absolute; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-size: 1.2rem; cursor: pointer; z-index: 10;
        }
        #instructions h1 { margin-bottom: 10px; font-size: 2.5rem; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: white; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
            opacity: 0.7; display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="instructions">
        <h1>คลิกเพื่อเริ่มเล่น</h1>
        <p>มุมมองบุคคลที่ 1: ขยับเมาส์เพื่อหันมอง<br>เดิน: W, A, S, D | ออกจากระบบ: ESC</p>
    </div>
    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // อาร์เรย์สำหรับเก็บข้อมูลรถสัญจร
        let cars = [];
        const carSpeed = 0.15;

        const instructions = document.getElementById('instructions');
        const crosshair = document.getElementById('crosshair');

        init();
        animate();

        function init() {
            // 1. สร้างฉากและตั้งค่าพื้นหลังเป็นท้องฟ้าสีฟ้า
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            // 2. กล้องถ่ายภาพ (ระดับสายตาคนสูงประมาณ 1.6 หน่วย)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); 

            // 3. ระบบควบคุมบุคคลที่ 1 (Pointer Lock)
            controls = new THREE.PointerLockControls(camera, document.body);

            instructions.addEventListener('click', () => { controls.lock(); });
            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
                crosshair.style.display = 'block';
            });
            controls.addEventListener('unlock', () => {
                instructions.style.display = 'flex';
                crosshair.style.display = 'none';
            });

            scene.add(controls.getObject());

            // ตรวจจับการกดแป้นพิมพ์
            const onKeyDown = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            };
            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // 4. แสงสว่าง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 5. สร้างสิ่งแวดล้อม
            createWorld();

            // 6. เรนเดอร์ลงหน้าจอ
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function createWorld() {
            // สวน/พื้นดินรอบๆ
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x557a46 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // --- [สร้างบ้าน] ---
            // พื้นบ้าน (ยกสูงขึ้นนิดหน่อย)
            const floorGeo = new THREE.PlaneGeometry(8, 8);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, 0.01, -2);
            scene.add(floor);

            // ผนังบ้าน (ใช้กล่องสี่เหลี่ยมประกอบกัน)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc });
            
            const wallBack = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 0.2), wallMat); // หลัง
            wallBack.position.set(0, 1.5, -6);
            scene.add(wallBack);

            const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 8), wallMat); // ซ้าย
            wallLeft.position.set(-4, 1.5, -2);
            scene.add(wallLeft);

            const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 8), wallMat); // ขวา
            wallRight.position.set(4, 1.5, -2);
            scene.add(wallRight);

            // ผนังหน้าบ้าน (แบ่งเป็นฝั่งซ้ายและขวา เว้นตรงกลางเป็นประตูให้เดินออกได้)
            const wallFrontLeft = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.2), wallMat);
            wallFrontLeft.position.set(-2.5, 1.5, 2);
            scene.add(wallFrontLeft);

            const wallFrontRight = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.2), wallMat);
            wallFrontRight.position.set(2.5, 1.5, 2);
            scene.add(wallFrontRight);

            const wallFrontTop = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 0.2), wallMat); // ขอบบนประตู
            wallFrontTop.position.set(0, 2.6, 2);
            scene.add(wallFrontTop);

            // หลังคาบ้าน
            const roofGeo = new THREE.ConeGeometry(6, 2, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 4, -2);
            roof.rotation.y = Math.PI / 4;
            scene.add(roof);


            // --- [สร้างถนนนอกบ้าน] ---
            const roadGeo = new THREE.PlaneGeometry(1000, 12);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0.02, 15); // ห่างจากหน้าบ้านออกไป 15 หน่วย
            scene.add(road);

            // เส้นกลางถนน
            for(let i = -200; i < 200; i += 10) {
                const lineGeo = new THREE.PlaneGeometry(4, 0.2);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i, 0.03, 15);
                scene.add(line);
            }

            // --- [ระบบเกิดรถอัตโนมัติ] ---
            // สร้างรถเริ่มต้นไว้ 4 คัน กระจายตำแหน่งกัน
            for (let i = 0; i < 4; i++) {
                spawnCar((i * 60) - 100);
            }
        }

        function spawnCar(xPosition = -150) {
            // โมเดลรถแบบง่าย (กล่องสีแดง มีล้อสีดำ)
            const carGroup = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(4, 1.2, 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0xcc2222 : 0x2222cc }); // สุ่มรถสีแดงหรือน้ำเงิน
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            carGroup.add(body);

            // กระจกหน้ารถ
            const cabinGeo = new THREE.BoxGeometry(2, 0.8, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0.2, 1.6, 0);
            carGroup.add(cabin);

            // ล้อรถ 4 ล้อ
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 12);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            const positions = [[-1.2, 0.4, 1], [1.2, 0.4, 1], [-1.2, 0.4, -1], [1.2, 0.4, -1]];
            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.x = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                carGroup.add(wheel);
            });

            // สุ่มให้วิ่งเลนซ้ายหรือขวา
            const isLeftLane = Math.random() > 0.5;
            carGroup.position.set(xPosition, 0, isLeftLane ? 13.5 : 16.5);
            
            // ถ้าวิ่งเลนขวา ให้หันหน้ากลับไปอีกทางหนึ่ง
            carGroup.userData = { direction: isLeftLane ? 1 : -1 };
            if(!isLeftLane) carGroup.rotation.y = Math.PI;

            scene.add(carGroup);
            cars.push(carGroup);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                // การหน่วงความเร็วในการเดิน (Damping)
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); 

                // ปรับความเร็วเคลื่อนที่ตามปุ่มที่กด
                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                prevTime = time;
            }

            // --- [อัปเดตการเคลื่อนที่ของรถยนต์] ---
            cars.forEach((car, index) => {
                car.position.x += carSpeed * car.userData.direction;

                // ถ้ารถวิ่งเลยขอบแมพ ให้วาร์ปกลับไปเริ่มใหม่ฝั่งตรงข้าม
                if (car.position.x > 150 && car.userData.direction === 1) {
                    car.position.x = -150;
                } else if (car.position.x < -150 && car.userData.direction === -1) {
                    car.position.x = 150;
                }
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
