<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SONIC 3 A.I.R - THREE.JS EDITION</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #2288dd;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* 📊 UI สไตล์เกม Retro Sonic */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      border: 3px solid #ffcc00;
      pointer-events: none;
      z-index: 10;
      min-width: 200px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .sonic-text {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 5px;
      text-shadow: 2px 2px #000;
    }
    #zone-title { color: #ffcc00; }
    #score-text { color: #ff3333; }
    #ring-text { color: #ffcc00; }

    /* เป้าเล็งตรงกลางหน้าจอ */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #ffcc00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 4px #000;
    }

    /* จอยสติ๊กควบคุมสัมผัส */
    #joystick-zone {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid #ffcc00;
      border-radius: 50%;
      touch-action: none;
      z-index: 10;
    }
    #joystick-stick {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #0055ff, #0022aa);
      border: 2px solid #fff;
      border-radius: 50%;
      position: absolute;
      left: 32px;
      top: 32px;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <div class="sonic-text" id="zone-title">ANGEL ISLAND ZONE</div>
    <div class="sonic-text" id="score-text">SCORE: 000000</div>
    <div class="sonic-text" id="ring-text">✨ RINGS: 000</div>
    <div style="font-size: 0.75rem; margin-top: 5px; color: #aaa;">*ลากจอฝั่งซ้ายเดิน | ลากจอฝั่งขวาหันมุมกล้อง*</div>
  </div>

  <div id="crosshair"></div>
  <div id="canvas-container"></div>
  <div id="joystick-zone"><div id="joystick-stick"></div></div>
  <script>
    // --- 1. ตั้งค่าฉากหลัง ท้องฟ้าสีสดใส ไร้หมอกมืด ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3399ff); // ฟ้าสดใสสไตล์ด่านแรกรุ่นเก๋า
    
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // แสงแดดจ้าสะท้อนสีสันฉากสุดแจ่ม
    const sunLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(sunLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(40, 80, 40);
    scene.add(dirLight);

    // --- 2. การสร้างพื้นหญ้าสีเขียวสดและตารางหมากรุก (Sonic Texture Logic) ---
    const mapGroup = new THREE.Group();
    scene.add(mapGroup);

    // ฟังก์ชันสร้างบล็อกทางเดินตารางหมากรุกสไตล์โซนิค
    function createSonicBlock(x, y, z, w, h, d) {
      const blockGroup = new THREE.Group();
      
      // ส่วนบน: พื้นหญ้าสีเขียวสด
      const grassGeo = new THREE.BoxGeometry(w, 0.3, d);
      const grassMat = new THREE.MeshStandardMaterial({ color: 0x00cc44, roughness: 0.7 });
      const grass = new THREE.Mesh(grassGeo, grassMat); // แก้ไขบั๊กตรงนี้แล้วจ้า!
      grass.position.y = h / 2;
      blockGroup.add(grass);

      // ส่วนล่าง: ดินลายตารางสีน้ำตาลเหลืองสลับกัน
      const dirtGeo = new THREE.BoxGeometry(w, h - 0.3, d);
      const dirtMat = new THREE.MeshStandardMaterial({ color: 0x995522, roughness: 0.9 });
      const dirt = new THREE.Mesh(dirtGeo, dirtMat);
      dirt.position.y = -0.15;
      blockGroup.add(dirt);

      blockGroup.position.set(x, y, z);
      mapGroup.add(blockGroup);
    }

    // --- 3. ออกแบบแผนที่ "หลายเส้นทาง" และ "แม่น้ำไหลผ่าน" ---
    // พื้นโซนเริ่มต้น
    createSonicBlock(0, 0, 40, 30, 2, 30);

    // 🌊 แม่น้ำสีฟ้ายาวตัดผ่านกลางฉาก
    const riverGeo = new THREE.PlaneGeometry(16, 200);
    const riverMat = new THREE.MeshStandardMaterial({ color: 0x00ddff, roughness: 0.2, transparent: true, opacity: 0.8 });
    const river = new THREE.Mesh(riverGeo, riverMat);
    river.rotation.x = -Math.PI / 2;
    river.position.set(0, -0.8, -10);
    scene.add(river);

    // สะพานไม้ข้ามแม่น้ำเชื่อมทางเดิน
    const bridgeGeo = new THREE.BoxGeometry(18, 0.2, 8);
    const bridgeMat = new THREE.MeshStandardMaterial({ color: 0xcc8844, roughness: 0.6 });
    const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
    bridge.position.set(0, 0.2, 20);
    scene.add(bridge);

    // 🔀 เส้นทางแยกฝั่งข้ามแม่น้ำ (เลือกไปได้หลายทาง)
    // เส้นทางซ้าย: ทางระดับสูง ไต่โขดหิน
    createSonicBlock(-25, 0, -10, 15, 2, 40);
    createSonicBlock(-25, 2, -40, 15, 4, 30); // ทางยกระดับสูงขึ้น

    // เส้นทางขวา: ทางเลียบแม่น้ำและต้นไม้หนาตา
    createSonicBlock(25, 0, -10, 15, 2, 40);
    createSonicBlock(25, 0, -45, 15, 2, 30);

    // --- 4. ตกแต่งต้นไม้สไตล์ Sonic 3 A.I.R ---
    function createSonicTree(x, z) {
      const treeGroup = new THREE.Group();
      
      // ลำต้นตรงสีส้มน้ำตาลแบบย้อนยุค
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 4), new THREE.MeshStandardMaterial({ color: 0xdd7722 }));
      trunk.position.y = 2;
      treeGroup.add(trunk);

      // พุ่มใบไม้ทรงเหลี่ยมเลเยอร์ชั้นๆ
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x00aa33, roughness: 0.5 });
      for(let i = 0; i < 3; i++) {
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.2 - (i*0.5), 2, 5), leafMat);
        leaves.position.y = 3.5 + (i * 1.2);
        treeGroup.add(leaves);
      }
      
      treeGroup.position.set(x, 0.8, z);
      scene.add(treeGroup);
    }

    // วางต้นไม้กระจายตามเส้นทางต่างๆ
    createSonicTree(-8, 35);
    createSonicTree(8, 35);
    createSonicTree(-25, -5);
    createSonicTree(-22, -25);
    createSonicTree(25, -20);
    createSonicTree(28, -40);

    // --- 5. วางไอเทมวงแหวนทองคำ (Rings) เอกลักษณ์ของเกมโซนิค ---
    const rings = [];
    function spawnRing(x, y, z) {
      const ringGeo = new THREE.TorusGeometry(0.4, 0.1, 8, 24);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.1, emissive: 0x443300 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.set(x, y, z);
      scene.add(ring);
      rings.push(ring);
    }

    // วางแหวนตามทางเลือกเดิน
    spawnRing(-25, 1.8, -5); spawnRing(-25, 1.8, -10); // ทางซ้าย
    spawnRing(0, 1.5, 20); spawnRing(25, 1.8, -15);    // บนสะพาน และ ทางขวา

    // --- 6. ระบบควบคุมผ่านหน้าจอแท็บเล็ต มุมกล้องที่เก็บจากของเก่ามาใช้ ---
    let playerPosition = new THREE.Vector3(0, 2.2, 45); // จุดเกิดโซนแรก
    camera.position.copy(playerPosition);

    let moveX = 0, moveZ = 0;
    let yaw = 0, pitch = 0;
    let joystickTouchId = null, lookTouchId = null;
    let lastTouchX = 0, lastTouchY = 0;

    const stick = document.getElementById('joystick-stick');
    const zone = document.getElementById('joystick-zone');
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const maxRadius = 35;

    window.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.clientX < window.innerWidth / 2 && touch.clientY > window.innerHeight / 2 && joystickTouchId === null) {
          joystickTouchId = touch.identifier;
          updateJoystick(touch);
        } else if (lookTouchId === null) {
          lookTouchId = touch.identifier;
          lastTouchX = touch.clientX; lastTouchY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        if (touch.identifier === joystickTouchId) updateJoystick(touch);
        if (touch.identifier === lookTouchId) {
          const deltaX = touch.clientX - lastTouchX;
          const deltaY = touch.clientY - lastTouchY;
          yaw -= deltaX * 0.005; pitch -= deltaY * 0.005;
          pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
          lastTouchX = touch.clientX; lastTouchY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
          joystickTouchId = null; stick.style.transform = 'translate(0px, 0px)';
          moveX = 0; moveZ = 0;
        }
        if (touch.identifier === lookTouchId) lookTouchId = null;
      }
    });

    function updateJoystick(touch) {
      let deltaX = touch.clientX - centerX;
      let deltaY = touch.clientY - centerY;
      const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      if (distance > maxRadius) {
        deltaX = (deltaX / distance) * maxRadius;
        deltaY = (deltaY / distance) * maxRadius;
      }
      stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      moveX = deltaX / maxRadius; moveZ = -deltaY / maxRadius;
    }

    // --- 7. ลูปขับเคลื่อนแอนิเมชันและระบบเกม (Game Loop) ---
    const clock = new THREE.Clock();
    const playerSpeed = 11.0; 
    let ringCount = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // การเคลื่อนที่อิงตามมุมหันของตัวละคร
      if (moveX !== 0 || moveZ !== 0) {
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const moveDirection = forward.clone().multiplyScalar(moveZ).add(right.clone().multiplyScalar(moveX)).normalize();
        playerPosition.addScaledVector(moveDirection, playerSpeed * delta);
      }
      camera.position.copy(playerPosition);

      // ระบบควบคุมทิศทางสายตา
      const target = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      camera.lookAt(camera.position.clone().add(target.normalize()));

      // 🔄 อนิเมชันวงแหวนหมุนติ้วๆ และระบบตรวจจับการเก็บแหวน
      rings.forEach((ring, idx) => {
        ring.rotation.y = time * 2.5;
        
        // ตรวจสอบว่าผู้เล่นเดินชนแหวนหรือไม่
        if(playerPosition.distanceTo(ring.position) < 2.2) {
          scene.remove(ring);
          rings.splice(idx, 1);
          ringCount++;
          document.getElementById('ring-text').innerText = `✨ RINGS: ${String(ringCount).padStart(3, '0')}`;
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
