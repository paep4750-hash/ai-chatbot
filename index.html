<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AI - SUPER TERMINAL V3</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0b0d17;
      background-image: radial-gradient(circle at 50% 50%, #1a1f38 0%, #0b0d17 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e8f0;
      box-sizing: border-box;
    }

    .chat-container {
      width: 100vw;
      height: 100vh;
      max-width: 800px;
      max-height: 850px;
      background: rgba(15, 22, 42, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 600px) {
      .chat-container {
        border-radius: 16px;
        height: 85vh;
        width: 90vw;
      }
    }

    .chat-header {
      background: rgba(30, 41, 59, 0.9);
      padding: 20px;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header .status-tag {
      font-size: 0.8rem;
      background: rgba(0, 255, 157, 0.1);
      color: #00ff9d;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 157, 0.3);
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      font-size: 1rem;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.bot {
      background: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .msg.user {
      background: linear-gradient(135deg, #0072ff, #00f0ff);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input-area {
      display: flex;
      padding: 15px;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .chat-submit {
      background: #00f0ff;
      border: none;
      border-radius: 8px;
      color: #0b0d17;
      padding: 0 24px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    
    .chat-submit:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>

    </div>
  </div>
